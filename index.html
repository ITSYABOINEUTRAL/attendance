<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="lfc.png" type="image/x-icon">
    <title>Attendance Management System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <h1>Attendance Management System</h1>

        <div class="wrapper">
            <h1 class="title">Welcome</h1>
            <h2 id="current-datetime"><br></h2>
            <br>

            <h2 style="text-align: center; margin: 2rem 0 1.5rem 0; color: #fff;">First-Time Users</h2>

            <form id="attendanceForm" style="max-width: 520px; margin: 0 auto;">
                <div class="form-group" style="margin-bottom: 1.8rem;">
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder=" " 
                        required>
                    <label for="name">Enter Your Full Name</label>
                </div>

                <div style="text-align: center;">
                    <button type="submit" id="presentBtn" style="width: 180px; padding: 14px 30px; font-size: 17px;">
                        Mark Present
                    </button>
                </div>
            </form>
        </div>

        <hr>
        <footer>
            <p>Copyright &copy; 2025 Attendance Management System. All rights reserved.</p>
        </footer>
    </div>

    <!-- Beautiful Glassmorphic Input Styles -->
    <style>
        .form-group {
            position: relative;
            width: 100%;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            color: #fff;
            outline: none;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
            background: rgba(15, 23, 42, 0.85);
        }

        .form-group label {
            position: absolute;
            left: 16px;
            top: 14px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus ~ label,
        .form-group input:not(:placeholder-shown) ~ label {
            top: -8px;
            left: 12px;
            font-size: 12px;
            color: #3b82f6;
            background: rgba(15, 23, 42, 0.9);
            padding: 0 6px;
            border-radius: 4px;
        }

        button:hover {
            background: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
    </style>

    <script>
        const form = document.getElementById('attendanceForm');
        const btn = document.getElementById('presentBtn');
        const nameInput = document.getElementById('name');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = nameInput.value.trim();
            if (!name) return alert('Please enter your name');

            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                const res = await fetch('https://attendance-backend-ub0l.onrender.com/api/attendance/first-time', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                const data = await res.json();

                if (res.ok) {
                    alert('Attendance saved successfully!');
                    window.location.href = `https://attendance-dusky-sigma.vercel.app/attendance-records.html?memberId=${data.memberId}`;
                } else {
                    alert(data.message || 'Attendance already marked today!');
                }
            } catch (err) {
                console.error(err);
                alert('Server error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Mark Present';
            }
        });
    </script>

    <script>
        function updateDateTime() {
            const now = new Date();
            const optionsDate = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
            const formattedDate = now.toLocaleDateString("en-ZA", optionsDate);

            const optionsTime = { hour: "2-digit", minute: "2-digit", hour12: true };
            const formattedTime = now.toLocaleTimeString("en-ZA", optionsTime);

            document.getElementById("current-datetime").innerHTML =
                `${formattedDate} <br> ${formattedTime}`;
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
